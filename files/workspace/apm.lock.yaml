- chrome-devtools
- context7
- exa
- gh_grep
- node_repl
- openaiDeveloperDocs
mcp_configs:
  chrome-devtools:
    name: chrome-devtools
    transport: stdio
    args:
    - chrome-devtools-mcp@latest
    - --auto-connect
    - --channel=stable
    registry: false
    command: npx
  context7:
    name: context7
    transport: http
    registry: false
    url: https://mcp.context7.com/mcp
    env_http_headers:
      CONTEXT7_API_KEY: CONTEXT7_API_KEY
  exa:
    name: exa
    transport: http
    registry: false
    url: https://mcp.exa.ai/mcp
  gh_grep:
    name: gh_grep
    transport: http
    registry: false
    url: https://mcp.grep.app
  node_repl:
    name: node_repl
    transport: stdio
    env:
      NODE_REPL_NATIVE_PIPE_CONNECT_TIMEOUT_MS: '1000'
      NODE_REPL_NODE_MODULE_DIRS: /Applications/ChatGPT.app/Contents/Resources/cua_node/lib/node_modules
      NODE_REPL_NODE_PATH: /Applications/ChatGPT.app/Contents/Resources/cua_node/bin/node
      NODE_REPL_TRUSTED_CODE_PATHS: /Users/hj/.codex
      CODEX_HOME: /Users/hj/.codex
      NODE_REPL_TRUSTED_BROWSER_CLIENT_SHA256S: 6d25aa7656feac858f3a3bdaea5bcbab0dbfd426c9de8e6931ce90c399ee8e4f,c8b7e809d7cf9e20a57123b2530d476ccec9a01a6230a7b2b924fea7d94d7f4a
      BROWSER_USE_AVAILABLE_BACKENDS: chrome,iab
      NODE_REPL_INSTRUCTIONS_USE_CASE_BROWSER: Control the in-app browser in conjunction
        with the Browser Plugin.
      NODE_REPL_INSTRUCTIONS_USE_CASE_CHROME: Control the Chrome browser in conjunction
        with the Chrome Plugin. Prefer this method of controlling Chrome over alternatives
        (such as Computer Use) unless the user explicitly mentions an alternative.
      NODE_REPL_INSTRUCTIONS_USE_CASE_COMPUTER_USE: Control desktop apps on macOS
        through Computer Use.
      BROWSER_USE_CODEX_APP_BUILD_FLAVOR: prod
      BROWSER_USE_CODEX_APP_VERSION: 26.707.31428
      SKY_CUA_SERVICE_PATH: /Users/hj/.codex/plugins/cache/openai-bundled/computer-use/1.0.1000366/Codex
        Computer Use.app
      CODEX_CLI_PATH: /Users/hj/.cache/.bun/bin/codex
    args: []
    registry: false
    command: /Applications/ChatGPT.app/Contents/Resources/cua_node/bin/node_repl
    startup_timeout_sec: 120
  openaiDeveloperDocs:
    name: openaiDeveloperDocs
    transport: http
    registry: false
    url: https://developers.openai.com/mcp
mcp_target_servers:
  claude:
  - chrome-devtools
  - context7
  - exa
  - gh_grep
  - node_repl
  - openaiDeveloperDocs
  codex:
  - chrome-devtools
  - context7
  - exa
  - gh_grep
  - node_repl
  - openaiDeveloperDocs
  cursor:
  - chrome-devtools
  - context7
  - exa
  - gh_grep
  - node_repl
  - openaiDeveloperDocs
