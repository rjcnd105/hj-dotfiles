# .codex/AGENTS.md is the source of the personal agent guide. Claude and Pi read
# it through relative symlinks; Cursor needs its own frontmatter, so it gets an
# append; Antigravity reads ~/.gemini/AGENTS.md directly (copy so homes/file.nix
# projects it into ~).
extras:
  - name: agent-guide
    source: .codex
    file: AGENTS.md
    targets:
      - path: .claude/rules
        mode: symlink
        as: personal-agent-guide.md
      - path: .cursor/rules
        mode: append
        as: personal-agent-guide.mdc
      - path: .config/pi
        mode: symlink
        as: AGENTS.md
      - path: .gemini
        mode: copy
        as: AGENTS.md

mcp:
  servers:
    chrome-devtools:
      command: npx
      args:
        - chrome-devtools-mcp@latest
        - --auto-connect
        - --channel=stable
      targets: [claude, codex, cursor]
    openaiDeveloperDocs:
      url: https://developers.openai.com/mcp
      targets: [claude, codex, cursor]
    rea:
      command: npx
      args:
        - -y
        - rea-agents@latest
        - mcp
      targets: [claude, codex, cursor]

ignore:
  - .DS_Store
  - .git/
  - __pycache__/

audit:
  block_threshold: CRITICAL
