# Copy mode keeps real skill files in .claude/skills and .agents/skills, so git
# (and comin on the homelab) delivers them without running skillshare there.
targets:
  - name: claude
    skills:
      mode: copy
      exclude:
        - elixir
        - find-docs
        - obsidian-bases
        - gitbutler
  - name: codex
    skills:
      mode: copy
  - name: cursor
    skills:
      enabled: false

