name: hj-agent-settings
version: 1.0.0
description: Codex-first agent settings projected to Claude Code and Cursor
targets:
  - codex
  - claude
  - cursor
includes: auto

dependencies:
  apm:
    # Public skills previously managed by the Skills CLI.
    - git: https://github.com/anthropics/claude-code.git
      path: plugins/plugin-dev
      skills:
        - hook-development
        - skill-development
    - mattpocock/skills/skills/productivity/grill-me
    - mattpocock/skills/skills/engineering/grill-with-docs
    - mattpocock/skills/skills/productivity/writing-for-agents
    - dammyjay93/interface-design/.claude/skills/interface-design
    - michalzubkowicz/nixos-management-skill/nixos-managing
    - git: https://github.com/kepano/obsidian-skills.git
      skills:
        - obsidian-markdown
    - git: https://github.com/anthropics/skills.git
      skills:
        - pdf
        - skill-creator
    - git: https://github.com/cathrynlavery/diagram-design.git
      skills:
        - diagram-design
    # Complete published HyperFrames set (seven skills since upstream #5651).
    # HYPERFRAMES_SKIP_SKILLS in mise env keeps its CLI from installing or
    # refreshing copies in the APM-owned skill directories.
    # Skill paths: the repo root is a Copilot-only Agent Plugin for APM.
    - heygen-com/hyperframes/skills/hyperframes
    - heygen-com/hyperframes/skills/hyperframes-cli
    - heygen-com/hyperframes/skills/hyperframes-registry
    - heygen-com/hyperframes/skills/media-use
    - heygen-com/hyperframes/skills/figma
    - heygen-com/hyperframes/skills/remotion-to-hyperframes
    - heygen-com/hyperframes/skills/slideshow

    - mattpocock/skills/skills/engineering/domain-modeling
    - mattpocock/skills/skills/productivity/grilling
    - git: Xerxes-2/jujutsu-suki
    - git: typesafe-ai/skills
      skills:
        - typesafe-ai
    - adhhamdev/modern-react-guidance
    - GoogleChrome/modern-web-guidance/skills/modern-web-guidance

