  mcp:
    - name: chrome-devtools
      registry: false
      transport: stdio
      command: npx
      args:
        - chrome-devtools-mcp@latest
        - --auto-connect
        - --channel=stable

    - name: openaiDeveloperDocs
      registry: false
      transport: http
      url: https://developers.openai.com/mcp

    - name: context7
      registry: false
      transport: http
      url: https://mcp.context7.com/mcp
      # Codex resolves this header value from the mise-provided environment at
      # server start. Keeping the native field avoids writing the secret into
      # tracked generated files during `apm install`.
      env_http_headers:
        CONTEXT7_API_KEY: CONTEXT7_API_KEY

    - name: node_repl
      registry: false
      transport: stdio
      command: 
        /Applications/ChatGPT.app/Contents/Resources/cua_node/bin/node_repl
      args: []
      startup_timeout_sec: 120
      env:
        NODE_REPL_NATIVE_PIPE_CONNECT_TIMEOUT_MS: "1000"
        NODE_REPL_NODE_MODULE_DIRS: 
          /Applications/ChatGPT.app/Contents/Resources/cua_node/lib/node_modules
        NODE_REPL_NODE_PATH: 
          /Applications/ChatGPT.app/Contents/Resources/cua_node/bin/node
        NODE_REPL_TRUSTED_CODE_PATHS: /Users/hj/.codex
        CODEX_HOME: /Users/hj/.codex
        NODE_REPL_TRUSTED_BROWSER_CLIENT_SHA256S: 
          6d25aa7656feac858f3a3bdaea5bcbab0dbfd426c9de8e6931ce90c399ee8e4f,c8b7e809d7cf9e20a57123b2530d476ccec9a01a6230a7b2b924fea7d94d7f4a
        BROWSER_USE_AVAILABLE_BACKENDS: chrome,iab
        NODE_REPL_INSTRUCTIONS_USE_CASE_BROWSER: Control the in-app browser in 
          conjunction with the Browser Plugin.
        NODE_REPL_INSTRUCTIONS_USE_CASE_CHROME: Control the Chrome browser in 
          conjunction with the Chrome Plugin. Prefer this method of controlling 
          Chrome over alternatives (such as Computer Use) unless the user 
          explicitly mentions an alternative.
        NODE_REPL_INSTRUCTIONS_USE_CASE_COMPUTER_USE: Control desktop apps on 
          macOS through Computer Use.
        BROWSER_USE_CODEX_APP_BUILD_FLAVOR: prod
        BROWSER_USE_CODEX_APP_VERSION: 26.707.31428
        SKY_CUA_SERVICE_PATH: 
          /Users/hj/.codex/plugins/cache/openai-bundled/computer-use/1.0.1000366/Codex
          Computer Use.app
        CODEX_CLI_PATH: /Users/hj/.cache/.bun/bin/codex
