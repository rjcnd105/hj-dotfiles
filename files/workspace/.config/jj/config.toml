#:schema https://docs.jj-vcs.dev/latest/config-schema.json

[user]
name = "hj"
email = "rjcnd123@gmail.com"
editor = "zed"

[ui]
editor = "hx"
default-command = "log"
diff-formatter = "difft"

[git]
private-commits = "description(glob:'wip:*') | description(glob:'private:*')"

[snapshot]
auto-update-stale = true

[merge-tools.zed]
program = "zed"
diff-args = ["--wait", "--new", "--diff", "$left", "$right"]
# Zed는 아직 3-way merge 전용 UI가 없어 충돌 마커가 들어간 파일을 직접 열어 수정한다.
merge-args = ["--wait", "$output"]
merge-tool-edits-conflict-markers = true

[revset-aliases]
"closest_bm(to)" = "heads(::to & bookmarks())"
"closest_mut_bm(to)" = "heads(::to & bookmarks() & mutable())"

[aliases]
l = [
  "log",
  "-r",
  "@ | ancestors(trunk()..(visible_heads() & mine()), 2) | trunk()",
]
la = ["log", "-r", "all()"]
gfetch = ["git", "fetch", "--all-remotes"]
gpub = ["git", "push", "--allow-new"]
zdiff = ["diff", "--tool", "zed"]
consume = ["squash", "--into", "@", "--from"]
cp = ["restore", "--to", "@", "--from"]
eject = ["squash", "--from", "@", "--into"]
ai-desc = [
  "util",
  "exec",
  "--",
  "sh",
  "-c",
  "MSG=$(mise run gen-ai-desc) && [ -n \"$MSG\" ] && jj desc -m \"$MSG\" && printf '✓ %s\\n' \"$MSG\"",
  "",
]
