# ghostty가 alt+h/j/k/l, alt+n, alt+shift+h/j/k/l, alt+w를 먼저 소비하므로 ctrl+alt를 쓴다.
onboarding = false

[theme]
name = "terminal"

[keys]
focus_pane_left = ["prefix+h", "ctrl+alt+h"]
focus_pane_down = ["prefix+j", "ctrl+alt+j"]
focus_pane_up = ["prefix+k", "ctrl+alt+k"]
focus_pane_right = ["prefix+l", "ctrl+alt+l"]
# Herdr는 오른쪽/아래 분할만 지원한다.
split_vertical = ["prefix+v", "ctrl+alt+n", "ctrl+alt+shift+l"]
split_horizontal = ["prefix+minus", "ctrl+alt+shift+j"]
close_pane = ["prefix+x", "ctrl+alt+w"]

[experimental]
switch_ascii_input_source_in_prefix = true
