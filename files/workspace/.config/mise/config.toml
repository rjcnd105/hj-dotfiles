[settings]
experimental = true
python.uv_venv_auto = true
idiomatic_version_file_enable_tools = ["ruby"]
env_shell_expand = true
# age 키를 전역에서 리터럴로 고정한다. SOPS_AGE_KEY_FILE 환경변수에 의존하면
# lefthook 같은 비로그인 셸(git hook)에서 home.sessionVariables가 없어
# "no data key retrieved from metadata"로 sops 복호화가 실패한다.
sops.age_key_file = "{{env.HOME}}/.config/sops/age/keys.txt"

