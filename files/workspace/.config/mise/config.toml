[tasks.mise-completion]
run = """
  mise completion fish > ~/.config/fish/completions/mise.fish
  chmod +x ~/.config/fish/completions/mise.fish
"""


[tasks.chrome-debug]
run = '''
/Applications/Google\ Chrome\ Canary.app/Contents/MacOS/Google\ Chrome\ Canary --remote-debugging-port=9222 --user-data-dir=/tmp/chrome-debug
'''

[tasks.gen-ai-desc]
description = "AI로 jj commit description 자동 작성 (Codex GPT-5.4 Mini)"
run = '''
#!/usr/bin/env bash
set -euo pipefail

if jj diff --stat | grep -q "0 files changed"; then echo "변경사항이 없습니다" >&2; exit 1; fi
STAT=$(jj diff --stat)

PROMPT_FILE="${XDG_CONFIG_HOME:-$HOME/.config}/jj/commit-prompt.txt"
PROMPT=$(cat "$PROMPT_FILE")

MSG_FILE=$(mktemp)
trap 'rm -f "$MSG_FILE"' EXIT

{
  echo "[사용자 프롬프트]"
  echo "$PROMPT"
  echo
  echo "[변경 파일]"
  echo "$STAT"
  echo
  echo "[Diff (삭제 전용 파일 제외)]"
  jj diff --git | awk '/^diff --git/{header=$0; deleted=0} /^deleted file mode/{deleted=1} {if(!deleted) print}' | head -c 3000
} | codex exec \
  -m gpt-5.4-mini \
  -s read-only \
  --disable apps \
  --color never \
  --output-last-message "$MSG_FILE" \
  -c model_reasoning_effort='"low"' \
  -c 'mcp_servers={}' \
  -c default_tools_enabled=false \
  -c 'skills.config=[]' \
  - >/dev/null 2>/dev/null || true

MSG=$(cat "$MSG_FILE")

if [ -z "$MSG" ]; then echo "API 응답 실패"; exit 1; fi

printf '%s\n' "$MSG"
'''

# claude native 설치를 위함
[tasks.install-claude]
description = "Claude Code CLI 네이티브 스크립트로 설치"
run = "curl -fsSL https://claude.ai/install.sh | bash"

[env]
_.path = [
  # "$HOME/.cache/.bun/bin",
  # "$HOME/.local/scripts"
]
# `mise env --redacted` filters to redacted vars; it does not mask values.
_.file = [
  { path = "$HOME/.config/sops-nix/secrets/rendered/env/CONTEXT7_API_KEY.env", redact = true, read_only = true },
  { path = "$HOME/.config/sops-nix/secrets/rendered/env/GITHUB_TOKEN.env", redact = true, read_only = true },
]
SKILLIB = "$HOME/.local/agents/skills"
ASEPRITE_BIN = "/Applications/Aseprite.app/Contents/MacOS/aseprite"

MAX_CONSECUTIVE_AUTOCOMPACT_FAILURES = 3
CLAUDE_CODE_COORDINATOR_MODE = 1
CLAUDE_CODE_DISABLE_ADAPTIVE_THINKING = 1
ENABLE_LSP_TOOL = "1"
CLAUDE_CODE_AUTO_COMPACT_WINDOW = 400000

