name: Nix

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: "Commit to check"
        required: true
        type: string

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}

      - uses: DeterminateSystems/determinate-nix-action@v3
        with:
          github-token: ${{ secrets.NIX_GITHUB_TOKEN }}

      - name: Evaluate all-system flake outputs
        run: nix flake check --all-systems --no-build --show-trace

      - name: Evaluate darwin configuration
        run: nix eval .#darwinConfigurations.workspace_hj.system.drvPath --show-trace

      - name: Build and run x86_64-linux checks
        run: nix flake check --show-trace
